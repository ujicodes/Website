name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/keen-thompson-d2q1ci"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (if not already)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the actual site (index.html, css/, js/) — not the
      # whole repo (.claude/, .git metadata, workflow source, etc.).
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html css js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
